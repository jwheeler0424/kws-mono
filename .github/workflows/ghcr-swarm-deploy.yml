name: Deploy GHCR images to Swarm

on:
  registry_package:
    types: [published, updated]

concurrency:
  group: production-swarm-${{ github.event.registry_package.name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.registry_package.package_type == 'container'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGE_NAME: ${{ github.event.registry_package.name }}
      GHCR_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      SSH_HOST: ${{ vars.SSH_HOST || secrets.SSH_HOST || secrets.SWARM_SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
      SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME || secrets.SWARM_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SWARM_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS || secrets.SSH_KNOWN_HOSTS || secrets.SWARM_SSH_KNOWN_HOSTS }}
      SWARM_STACK_NAME: ${{ vars.SWARM_STACK_NAME || 'kws' }}
    steps:
      - name: Update the published app service
        shell: bash
        run: |
          set -euo pipefail

          package_name="${PACKAGE_NAME,,}"
          ghcr_owner="${GHCR_OWNER,,}"
          case "$package_name" in
            kyleweberseattle.com|*/kyleweberseattle.com)
              image="ghcr.io/${ghcr_owner}/kyleweberseattle.com:latest"
              service="${SWARM_STACK_NAME}_web"
              ;;
            kyleweberseattle.com-mls|*/kyleweberseattle.com-mls)
              image="ghcr.io/${ghcr_owner}/kyleweberseattle.com-mls:latest"
              service="${SWARM_STACK_NAME}_mls"
              ;;
            *)
              echo "Ignoring unpublished app package: ${PACKAGE_NAME}"
              exit 0
              ;;
          esac

          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_file"
          ssh_args=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file")
          swarm_host="${SSH_USERNAME}@${SSH_HOST}"

          printf '%s' "$GHCR_TOKEN" |
            ssh "${ssh_args[@]}" -p "$SSH_PORT" "$swarm_host" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

          ssh "${ssh_args[@]}" -p "$SSH_PORT" "$swarm_host" \
            "docker service update --detach=false --with-registry-auth --force --image '$image' '$service'"
