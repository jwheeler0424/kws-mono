name: Deploy GHCR images to Swarm
run-name: >-
  Deploy ${{ github.event_name == 'registry_package' && github.event.registry_package.name || inputs.services || 'web mls db' }}

on:
  registry_package:
    types: [published, updated]
  workflow_dispatch:
    inputs:
      services:
        description: Space-separated services to update (web, mls, db)
        required: false
        default: web mls db

concurrency:
  group: production-swarm
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'registry_package' ||
      (
        github.event.registry_package.package_type == 'container' &&
        github.event.registry_package.package_version.container_metadata.tag.name == 'latest'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGE_NAME: ${{ github.event.registry_package.name }}
      SERVICES: ${{ inputs.services }}
      GHCR_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      SSH_HOST: ${{ vars.SSH_HOST || secrets.SSH_HOST || secrets.SWARM_SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
      SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME || secrets.SWARM_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SWARM_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS || secrets.SSH_KNOWN_HOSTS || secrets.SWARM_SSH_KNOWN_HOSTS }}
      SWARM_STACK_NAME: ${{ vars.SWARM_STACK_NAME || 'kws' }}
    steps:
      - name: Update the changed services
        shell: bash
        run: |
          set -euo pipefail

          package_name="${PACKAGE_NAME,,}"
          ghcr_owner="${GHCR_OWNER,,}"
          services=()
          if [[ "$GITHUB_EVENT_NAME" == "registry_package" ]]; then
            case "$package_name" in
              kyleweberseattle.com|*/kyleweberseattle.com) services+=(web) ;;
              kyleweberseattle.com-mls|*/kyleweberseattle.com-mls) services+=(mls) ;;
              kyleweberseattle.com-db|*/kyleweberseattle.com-db) services+=(db) ;;
              *)
                echo "Ignoring unrelated package: ${PACKAGE_NAME}"
                exit 0
                ;;
            esac
          else
            read -r -a services <<< "${SERVICES:-web mls db}"
          fi

          deployments=()
          for service in "${services[@]}"; do
            case "$service" in
              web) deployments+=("ghcr.io/${ghcr_owner}/kyleweberseattle.com:latest|${SWARM_STACK_NAME}_web") ;;
              mls) deployments+=("ghcr.io/${ghcr_owner}/kyleweberseattle.com-mls:latest|${SWARM_STACK_NAME}_mls") ;;
              db) deployments+=("ghcr.io/${ghcr_owner}/kyleweberseattle.com-db:latest|${SWARM_STACK_NAME}_db") ;;
              *) echo "Unknown service: $service"; exit 1 ;;
            esac
          done

          if [[ ${#deployments[@]} -eq 0 ]]; then
            echo "No services to update"
            exit 0
          fi

          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_file"
          ssh_args=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file")
          swarm_host="${SSH_USERNAME}@${SSH_HOST}"

          printf '%s' "$GHCR_TOKEN" |
            ssh "${ssh_args[@]}" -p "$SSH_PORT" "$swarm_host" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

          for deployment in "${deployments[@]}"; do
            IFS='|' read -r image service <<< "$deployment"
            echo "Checking $image for $service"
            ssh "${ssh_args[@]}" -p "$SSH_PORT" "$swarm_host" \
              "docker pull '$image' >/dev/null && desired_image=\$(docker image inspect --format '{{index .RepoDigests 0}}' '$image') && current_image=\$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' '$service') && if [ \"\$current_image\" = \"\$desired_image\" ]; then echo 'Service already runs this digest'; else docker service update --detach=false --with-registry-auth --image \"\$desired_image\" '$service'; fi"
          done

          echo "Pruning stopped containers and unused images"
          ssh "${ssh_args[@]}" -p "$SSH_PORT" "$swarm_host" \
            "docker container prune -f && docker image prune -a -f"
